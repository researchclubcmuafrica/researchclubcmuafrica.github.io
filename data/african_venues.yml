# African venues, kept by hand.
# African workshops (such as AfricaNLP) are in data/manual/workshops.yaml,
# and African summer schools (such as the Deep Learning Indaba) in data/manual/summer-schools.yaml.
#
# The daily job (scripts/update_deadlines.py) adds these to the ai-deadlines list
# and writes data/deadlines.json. Edit this file when a new call for papers comes out.
#
# Fields:
#   title            Short name shown on the card (the year is added after it).
#   year             Year of the event.
#   full_name        Full name, with acronyms spelled out.
#   submission_type  What you submit, for example "Full paper", "Extended abstract", "Application".
#   deadline         'YYYY-MM-DD HH:MM:SS', or 'TBA' if not announced yet.
#   abstract_deadline (optional) Same format as deadline.
#   timezone         AoE (Anywhere on Earth), UTC, UTC+2, Africa/Kigali, and so on.
#   start, end       Event dates as YYYY-MM-DD. If unknown, leave them out and set date: 'To be announced'.
#   place            City, Country.
#   field            One or more fields, written in full.
#   link             Official page.
#   type             (optional) Conference, Workshop, Summer school, Community talk or Fellowship.
#                    Leave it out for a conference.


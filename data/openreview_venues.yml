# OpenReview venues to show on the tracker, kept by hand.
#
# You do NOT need to list conferences that are already in the ai-deadlines list
# (ICLR, NeurIPS, ICML, CVPR, ...). The script finds those on OpenReview by itself
# and adds the OpenReview date to their card.
#
# List here only extra venues you want on the page. OpenReview has about 1,000
# active venues, most of them outside the club's fields, so nothing else is added.
# Full list: https://openreview.net/venues
#
# Fields:
#   openreview  The venue ID on OpenReview with {year} in place of the year.
#               Find it in the venue's address: openreview.net/group?id=<ID>
#   title       Short name shown on the card (the year is added after it).
#   field       One or more fields, written in full.
#   africa      true for African venues (shows an "African venue" label).

# --- African venues and workshops ---
- openreview: AfriLang_AI/{year}/Conference
  title: AfriLang AI
  field: [Natural Language Processing]
  africa: true

- openreview: MICCAI.org/{year}/Workshop/AFRICAI
  title: AFRICAI
  field: [Medical Imaging]
  africa: true

- openreview: NeurIPS.cc/{year}/Workshop/Africa_in_AI
  title: Africa at NeurIPS
  field: [Machine Learning]
  africa: true

